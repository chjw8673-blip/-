<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레몬마켓 · 실시간 중고차 거래 실험</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#172323;background:#f5f8f6}*{box-sizing:border-box}body{margin:0}.top{background:#10372c;color:white;padding:20px 18px}.wrap{max-width:1050px;margin:auto}.brand{font-weight:800;font-size:24px;letter-spacing:-.7px}.muted{color:#6b7b76}.top .muted{color:#c8dfd5}.shell{padding:22px 16px 70px}.card{background:white;border:1px solid #e1e9e4;border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 2px 12px #102b1910}h1,h2,h3{margin:0 0 10px}h2{font-size:19px}h3{font-size:16px}p{line-height:1.6}input,button{font:inherit}input{border:1px solid #becdc5;border-radius:10px;padding:12px 14px;width:100%;margin:5px 0 12px}button{background:#16724c;border:0;border-radius:10px;color:white;padding:12px 17px;cursor:pointer;font-weight:700}button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}.secondary{background:#edf3ef;color:#144532}.danger{background:#a73232}.small{font-size:13px}.tag{display:inline-block;border-radius:999px;padding:5px 12px;background:#d7ede1;color:#17533b;font-size:13px;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#edf5ef;border-radius:12px;padding:15px}.num{font-size:28px;font-weight:800}.big{font-size:37px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}.choice{padding:19px 10px;border:2px solid #d4e5dc;background:white;color:#174735;min-height:95px}.choice:hover{border-color:#16724c;background:#eef8f1}.warn{background:#fff4df;border:1px solid #f3d9a4;padding:14px;border-radius:11px}.good{background:#e7f6e9;border:1px solid #c0ebd0;padding:14px;border-radius:11px}.error{color:#a12b2b;min-height:20px;margin:8px 0}.hidden{display:none!important}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e4ebe7;padding:10px 8px}th{background:#f0f5f2}.scroll{overflow-x:auto}.pill{padding:3px 9px;border-radius:8px;background:#e6eeeb}.footer{color:#6d7e75;font-size:12px;padding-top:15px}.meter{height:10px;background:#e2ece6;border-radius:9px;overflow:hidden}.fill{height:100%;background:#15915f}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.joinqr{display:flex;align-items:center;gap:24px;padding:18px 0;border-top:1px solid #e3ece6;margin-top:18px}.joinqr img{border:1px solid #e3ece6;border-radius:12px}@media(max-width:500px){.joinqr{flex-direction:column;align-items:flex-start}.big{font-size:30px}.shell{padding:15px 10px}.card{padding:16px}table{font-size:12px}}
</style></head><body><div class="top"><div class="wrap"><div class="brand">🍋 레몬마켓</div><div class="muted">정보 비대칭과 품질인증 제도 · 실시간 게임이론 실험</div></div></div><main class="wrap shell"><section id="login" class="card"><h2>게임 참가하기</h2><p class="muted">교수실 화면의 참가 코드를 입력하세요. 참가 신청 후 역할과 거래 상대가 무작위로 정해집니다.</p><label>참가 코드<input id="room" placeholder="예: 123456" inputmode="numeric" maxlength="6"></label><label>이름 또는 닉네임<input id="name" placeholder="예: 경제학과 12번" maxlength="25"></label><button onclick="join()">게임 참가</button><div id="loginErr" class="error"></div><hr style="border:0;border-top:1px solid #e3ece6;margin:24px 0"><details><summary>진행자 로그인</summary><p class="small muted">배포할 때 설정한 진행자 비밀번호(ADMIN_KEY)를 입력하세요.</p><input type="password" id="adminKey" placeholder="진행자 비밀번호"><button class="secondary" onclick="adminLogin()">진행자 화면 열기</button></details></section><section id="main" class="hidden"><div class="row" style="margin-bottom:16px"><span class="tag" id="who"></span><span class="tag" id="roundBadge"></span><span class="grow"></span><button class="secondary small" onclick="logout()">이 기기에서 나가기</button></div><div id="panel"></div></section><div class="footer">실험용 모형입니다. 실제 차량 거래에 사용하는 서비스가 아닙니다. · 5라운드 · 판매자 가치 H=12/L=4 · 구매자 가치 H=18/L=8</div></main><script>
let token=localStorage.getItem('lemonToken')||'',admin=localStorage.getItem('lemonAdmin')||'',snapshot=null,busy=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(route,payload,method='POST'){let res=await fetch(route,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(admin||token)},body:method==='GET'?undefined:JSON.stringify(payload||{})});const j=await res.json();if(!res.ok)throw Error(j.error||'요청 실패');return j}
function error(e){alert(e.message||String(e))}
async function join(){try{const j=await api('/api/join',{room:$('room').value.trim(),name:$('name').value.trim()});token=j.token;admin='';localStorage.setItem('lemonToken',token);localStorage.removeItem('lemonAdmin');refresh()}catch(e){$('loginErr').textContent=e.message}}
function adminLogin(){admin=$('adminKey').value.trim();token='';localStorage.setItem('lemonAdmin',admin);localStorage.removeItem('lemonToken');refresh()}
function logout(){localStorage.removeItem('lemonToken');localStorage.removeItem('lemonAdmin');token='';admin='';snapshot=null;$('login').classList.remove('hidden');$('main').classList.add('hidden')}
const btn=(label,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
function stats(s){return `<div class="grid"><div class="stat"><div class="muted small">거래 성사</div><div class="num">${s.transactions}건 <span class="small muted">/ ${s.pairs}쌍</span></div></div><div class="stat"><div class="muted small">거래된 좋은 차</div><div class="num">${s.goodSales}대</div></div><div class="stat"><div class="muted small">거래된 결함 차</div><div class="num">${s.lemonSales}대</div></div><div class="stat"><div class="muted small">시장 총잉여</div><div class="num">${s.totalSurplus}점</div></div><div class="stat"><div class="muted small">평균 거래가격</div><div class="num">${s.avgPrice.toFixed(1)}점</div></div><div class="stat"><div class="muted small">인증 대수</div><div class="num">${s.certified}대</div></div></div>`}
function historyTable(data){return `<div class="scroll"><table><thead><tr><th>R</th><th>인증</th><th>거래량</th><th>좋은 차</th><th>결함 차</th><th>판매자 보수</th><th>구매자 보수</th><th>총잉여</th></tr></thead><tbody>${data.map(s=>`<tr><td>${s.round}</td><td>${s.certified}/${s.pairs}</td><td>${s.transactions}</td><td>${s.goodSales}</td><td>${s.lemonSales}</td><td>${s.sellerPayoff}</td><td>${s.buyerPayoff}</td><td><b>${s.totalSurplus}</b></td></tr>`).join('')}</tbody></table></div>`}
function participant(v){if(!v.me)return `<div class="card">진행자 로그인이거나 아직 참가하지 않은 상태입니다.</div>`;
if(v.stage==='lobby')return `<div class="card"><h2>참가 완료 🎉</h2><p>${esc(v.me.name)}님, 진행자가 5라운드 게임을 시작할 때까지 대기하세요.</p><p class="muted">현재 ${v.registered}명 참가 중 · 참가자 수는 짝수여야 합니다.</p></div>`;
let a=v.assignment;if(!a)return '<div class="card">이번 라운드에 배정되지 않았습니다.</div>';
let quality=a.quality===null?'비공개':a.quality==='H'?'좋은 차 H':'결함 있는 차 L';
let header=`<div class="card"><h2>${a.role==='buyer'?'🛒 구매자':'🚘 판매자'} · ${a.pair}번 거래쌍</h2><p>상대 참가자: <b>${esc(a.partner)}</b></p><div class="row"><span class="tag">${a.certified?'공식 품질인증 완료':'미인증'}</span><span class="tag">차량 품질: ${quality}</span></div>${a.role==='seller'?'<p class="muted small">판매자는 실제 품질을 항상 알고 있습니다.</p>':'<p class="muted small">미인증 차량의 실제 품질은 구매자에게 공개되지 않습니다.</p>'}</div>`;
if(v.stage==='offers')return header+`<div class="card"><h2>구매자 가격 제시 단계</h2>${a.role==='buyer'?(a.offer===null?`<p>차량을 구매하기 위해 지불할 가격을 선택하세요.</p><div class="choices">${btn('6점 제시','offer(6)','choice')}${btn('14점 제시','offer(14)','choice')}${btn('구매 포기','offer(0)','choice')}</div>`:`<div class="good">${a.offer===0?'구매 포기':a.offer+'점 제시'}를 제출했습니다. 다른 구매자들을 기다리고 있습니다.</div>`):'<div class="warn">구매자가 가격을 제시하는 중입니다. 판매자는 잠시 대기하세요.</div>'}</div>`;
if(v.stage==='decisions')return header+`<div class="card"><h2>판매자 거래 결정 단계</h2>${a.role==='seller'?(a.decision!==null?`<div class="good">${a.decision==='accept'?'판매 수락':'판매 거절'}을 제출했습니다.</div>`:a.offer===0?`<div class="warn">구매자가 구매를 포기했습니다. ${btn('거래 종료 확인','decide("reject")')}</div>`:`<p>구매자가 제시한 가격: <span class="big">${a.offer}점</span></p><p class="muted small">차량 보유가치: ${a.quality==='H'?12:4}점. 판매하면 수익 = 제시가격 − 보유가치, 거절하면 0점입니다.</p><div class="choices">${btn('제시가격 수락','decide("accept")','choice')}${btn('판매 포기','decide("reject")','choice')}</div>`):`<div class="warn">${a.offer===0?'구매를 포기했습니다.':'제시가격 '+a.offer+'점을 전달했습니다.'} 판매자의 결정을 기다립니다.</div>`}</div>`;
if(v.stage==='results'){let r=a.result||{};return header+`<div class="card"><h2>이번 라운드 내 거래 결과</h2><p class="big">${r.sold?'✅ 거래 성사':'⛔ 거래 불발'}</p><p>실제 차량 품질: <b>${r.quality==='H'?'좋은 차 H':'결함 있는 차 L'}</b></p><p>판매자 보수: <b>${r.sellerPayoff}</b>점 · 구매자 보수: <b>${r.buyerPayoff}</b>점</p></div><div class="card"><h2>${v.round}라운드 전체 시장 결과</h2>${stats(v.history.at(-1))}</div><div class="card"><h2>라운드별 결과 비교</h2>${historyTable(v.history)}</div>`}
return header}
async function offer(n){try{await api('/api/offer',{offer:n});refresh()}catch(e){error(e)}}async function decide(decision){try{await api('/api/decision',{decision});refresh()}catch(e){error(e)}}
async function act(cmd){if(busy)return;try{busy=true;await api('/api/admin/'+cmd,{});refresh()}catch(e){error(e)}finally{busy=false}}
async function reset(){if(!confirm('모든 참가자와 5라운드 결과가 삭제됩니다. 초기화하시겠습니까?'))return;try{await api('/api/admin/reset',{confirm:'RESET'});refresh()}catch(e){error(e)}}
function csv(){window.open('/api/admin/export','_blank') /* Authorization header required; use fetch below instead */}
async function exportCSV(){try{let r=await fetch('/api/admin/export',{headers:{Authorization:'Bearer '+admin}});if(!r.ok)throw Error('CSV 저장에 실패했습니다.');let blob=await r.blob(),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='lemon-market-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){error(e)}}
function copyJoinLink(){const url=location.origin+'/?room='+encodeURIComponent(snapshot.room);navigator.clipboard.writeText(url).then(()=>alert('참가 링크를 복사했습니다.')).catch(()=>prompt('참가 링크',url))}
function administrator(v){let joinUrl=location.origin+'/?room='+encodeURIComponent(v.room);let qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=12&data='+encodeURIComponent(joinUrl);let controls=v.stage==='lobby'?btn('▶ 1라운드 시작','act("start")'):v.stage==='results'?(v.round<5?btn('▶ 다음 라운드 시작','act("next")'):'<span class="tag">5라운드 완료</span>'):v.stage==='offers'?btn('가격 제시 마감 · 미제출자는 구매 포기','act("advance")','secondary'):btn('판매 결정 마감 · 미제출자는 거절','act("advance")','secondary');
let label={lobby:'참가 대기',offers:'구매자 가격 제시',decisions:'판매자 수락·거절',results:'결과 발표'}[v.stage];
return `<div class="card"><h2>🎛️ 진행자 대시보드</h2><div class="grid"><div class="stat"><span class="muted small">참가 코드</span><div class="num">${esc(v.room)}</div></div><div class="stat"><span class="muted small">등록 인원</span><div class="num">${v.registered}명</div></div><div class="stat"><span class="muted small">진행 단계</span><div style="font-weight:800;margin-top:8px">${label}</div></div><div class="stat"><span class="muted small">이번 라운드 인증</span><div class="num">${v.certifiedCount}/${v.activePairs}</div></div></div><p>구매자 제출: <b>${v.offersReceived}/${v.activePairs}</b> · 판매자 결정: <b>${v.decisionsReceived}/${v.activePairs}</b></p><div class="meter"><div class="fill" style="width:${v.activePairs?(v.stage==='decisions'?v.decisionsReceived:v.offersReceived)/v.activePairs*100:0}%"></div></div><div class="btnrow">${controls}${btn('CSV 결과 저장','exportCSV()','secondary')}${btn('전체 초기화','reset()','danger')}</div><div class="joinqr"><img alt="참가 QR코드" src="${qrUrl}" width="185" height="185"><div><b>📱 수업 참가 QR코드</b><p class="small muted">학생은 QR을 스캔하면 참가 코드가 자동으로 입력됩니다.</p><p class="small" style="overflow-wrap:anywhere">${esc(joinUrl)}</p>${btn('참가 링크 복사','copyJoinLink()','secondary')}<p class="small muted">QR 이미지는 외부 QR 생성 서비스에서 불러옵니다. 이미지가 보이지 않아도 링크를 공유할 수 있습니다.</p></div></div><p class="small muted">미제출자를 강제 마감하면 구매 포기/판매 거절로 처리됩니다.</p></div>${v.history.length?`<div class="card"><h2>📊 누적 라운드 통계</h2>${historyTable(v.history)}</div><div class="card"><h2>최근 라운드 결과</h2>${stats(v.history.at(-1))}</div>`:''}<div class="card"><h2>참가자 및 역할 배정</h2>${v.stage==='lobby'?`<p class="muted">${v.players.map(x=>esc(x.name)).join(' · ')}</p>`:`<div class="scroll"><table><thead><tr><th>쌍</th><th>판매자</th><th>구매자</th><th>품질</th><th>인증</th><th>제시가격</th><th>결정</th></tr></thead><tbody>${v.adminPairs.map(x=>`<tr><td>${x.pair}</td><td>${esc(x.seller)}</td><td>${esc(x.buyer)}</td><td>${x.quality}</td><td>${x.certified?'예':'아니오'}</td><td>${x.offer===null?'대기':x.offer===0?'포기':x.offer}</td><td>${x.decision===null?'대기':x.decision==='accept'?'수락':'거절'}</td></tr>`).join('')}</tbody></table></div>`}</div>`}`}
async function refresh(){if(!admin&&!token)return;try{let v=await api('/api/state',{},'GET');if(admin&&!v.players){logout();return}if(token&&!v.me){logout();return}snapshot=v;$('login').classList.add('hidden');$('main').classList.remove('hidden');$('who').textContent=admin?'👨‍🏫 진행자':v.me.name;$('roundBadge').textContent=v.round?`${v.round} / 5 라운드`:'대기실';$('panel').innerHTML=admin?administrator(v):participant(v)}catch(e){console.warn(e.message)}}
const prefill=new URLSearchParams(location.search).get('room');if(prefill)$('room').value=prefill;if(admin||token)refresh();let stream=new EventSource('/events');stream.addEventListener('update',()=>refresh());stream.onerror=()=>{};setInterval(()=>{if(document.visibilityState==='visible')refresh()},6000);
</script></body></html>
